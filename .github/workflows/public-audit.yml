name: Public audit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit repository
        run: python3 scripts/public_audit.py
      - name: Verify generated indexes
        run: |
          python3 scripts/generate_challenge_docs.py
          git diff --exit-code -- docs/inventory.md docs/SHA256SUMS
