test_your_nc:
  image: docker:latest
  stage: build
  services:
    - docker:dind
  variables:
      # Challenge Category
    CATEGORY: [need_filled]
      # Challenge Name
    NAME: [need_filled]
    DOCKER_IMAGE_NAME: $CI_REGISTRY_IMAGE/$NAME
  before_script:
    - cd challenges/$CATEGORY/$NAME/source_code
    - docker login -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD" $CI_REGISTRY
  script:
    - docker build --pull -t "$DOCKER_IMAGE_NAME" .
    - docker push "$DOCKER_IMAGE_NAME"
  rules:
    - if: $CI_COMMIT_BRANCH
      changes:
        - challenges/$CATEGORY/$NAME/source_code/**
